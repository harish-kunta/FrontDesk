services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: frontdesk
      POSTGRES_USER: frontdesk
      POSTGRES_PASSWORD: frontdesk
    ports:
      - "5432:5432"
    volumes:
      - frontdesk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontdesk -d frontdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  frontdesk-postgres:
